services:
  frontend-webhook:
    image: void-webhook-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    volumes:
      - frontend_dist:/frontend_dist
    command:
      - sh
      - -c
      - rm -rf /frontend_dist/* && cp -r /app/dist/. /frontend_dist/ && echo done
    networks:
      - app

  backend-webhook:
    image: void-webhook-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/void_webhook?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '8080'
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend-webhook
      - frontend-webhook
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/webhook.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend_dist:/var/www/frontend:ro
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: void_webhook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d void_webhook"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

volumes:
  frontend_dist:
  postgres_data:

networks:
  app:
    driver: bridge
